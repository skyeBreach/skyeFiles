# ==================================================================================================================== #
# Dunst - Icons & Tags
#
# ==================================================================================================================== #
# App Icons

[global]
icon_theme = "Papirus-Dark, Adwaita"
enable_recursive_icon_lookup = true
icon_position = left
min_icon_size = 32
max_icon_size = 48

# ==================================================================================================================== #
# Urgency Tags

[tag_low]
msg_urgency = low
format = "<span foreground='#a5adcb'>󰋼</span>  <b>%s</b>\n%b"

[tag_normal]
msg_urgency = normal
format = "<span foreground='#8aadf4'>󰋽</span>  <b>%s</b>\n%b"

[tag_critical]
msg_urgency = critical
format = "<span foreground='#ed8796'>󰀦</span>  <b>%s</b>\n%b"

# ==================================================================================================================== #
