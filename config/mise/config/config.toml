# ==================================================================================================================== #
# Variables


# ==================================================================================================================== #
# Settings

[settings]
# Version Locking
lockfile = false
locked = false

# ==================================================================================================================== #
# File System

# Trusted Projects
trusted_config_paths = [
    "~/developer/projects",
    "~/developer/breached-software",
    "~/developer/templates",
]

# ==================================================================================================================== #
# Updating

[settings.self_update]
auto = true
check_duration = "1h"

