# ==================================================================================================================== #
# i3 - Theme
#
# See:
#   - https://github.com/catppuccin/i3
# ==================================================================================================================== #
# Palettes

# Catppuccin Macchiato
set $rosewater #f4dbd6
set $peach     #f5a97f
set $lavender  #b7bdf8
set $text      #cad3f5
set $subtext0  #a5adcb
set $overlay0  #6e738d
set $surface1  #494d64
set $surface0  #363a4f
set $base      #24273a
set $mantle    #1e2030

# ==================================================================================================================== #
# Windows

# target                    border      background  text        indicator   child_border
client.focused              $lavender   $lavender   $base       $rosewater  $lavender
client.focused_inactive     $overlay0   $surface1   $text       $rosewater  $surface1
client.unfocused            $overlay0   $mantle     $subtext0   $rosewater  $surface0
client.urgent               $peach      $peach      $base       $overlay0   $peach
client.placeholder          $overlay0   $base       $text       $overlay0   $overlay0
client.background           $base

# ==================================================================================================================== #
# Layout

# Fonts
font pango:Noto Sans 8

# Border
default_border pixel 2
default_floating_border pixel 0

# Window Title Formatting
for_window [all] title_format "   %title   "

# ==================================================================================================================== #
