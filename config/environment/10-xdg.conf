# ==================================================================================================================== #
# Environment - XDG Base Directories
#
# Deployed to ~/.config/environment.d/. systemd loads these for user services, and ~/.profile sources them for the
# X session and every shell, so everything sees the same values.
#
# See:
#   - https://specifications.freedesktop.org/basedir-spec/latest/
#   - https://www.freedesktop.org/software/systemd/man/latest/environment.d.html
# ==================================================================================================================== #
# Base Directories

XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state

# ==================================================================================================================== #
