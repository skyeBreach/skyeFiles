# ==================================================================================================================== #
# Environment - Relocations
#
# Moves tools that default to a hidden folder in ~ into the XDG base directories.
#
# See:
#   - https://wiki.archlinux.org/title/XDG_Base_Directory
# ==================================================================================================================== #
# Rust

CARGO_HOME=$XDG_DATA_HOME/cargo
RUSTUP_HOME=$XDG_DATA_HOME/rustup

# ==================================================================================================================== #
# JavaScript

BUN_INSTALL=$XDG_DATA_HOME/bun
NPM_CONFIG_USERCONFIG=$XDG_CONFIG_HOME/npm/npmrc
NPM_CONFIG_CACHE=$XDG_CACHE_HOME/npm
npm_config_devdir=$XDG_CACHE_HOME/electron-gyp

# ==================================================================================================================== #
# .NET

DOTNET_CLI_HOME=$XDG_DATA_HOME/dotnet
NUGET_PACKAGES=$XDG_CACHE_HOME/NuGetPackages

# ==================================================================================================================== #
# Infrastructure

DOCKER_CONFIG=$XDG_CONFIG_HOME/docker
ANSIBLE_HOME=$XDG_DATA_HOME/ansible
TFLINT_PLUGIN_DIR=$XDG_DATA_HOME/tflint/plugins

# ==================================================================================================================== #
# Applications

WINEPREFIX=$XDG_DATA_HOME/wine
PASSWORD_STORE_DIR=$XDG_DATA_HOME/pass
WAKATIME_HOME=$XDG_CONFIG_HOME/wakatime
CODEX_HOME=$XDG_DATA_HOME/codex
WGETRC=$XDG_CONFIG_HOME/wget/wgetrc

# ==================================================================================================================== #
# Graphics

__GL_SHADER_DISK_CACHE_PATH=$XDG_CACHE_HOME/nv

# ==================================================================================================================== #
