# ==================================================================================================================== #
# Polybar - i3 Workspaces
#
# See:
#   - https://github.com/polybar/polybar/wiki/Module:-i3
# ==================================================================================================================== #
# Behaviour

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

# ==================================================================================================================== #
# Labels

label-focused = %name%
label-focused-foreground = ${colors.text}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.mauve}
label-focused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.subtext0}
label-visible-underline = ${colors.overlay0}
label-visible-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.overlay1}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.peach}
label-urgent-padding = 1

# ==================================================================================================================== #
