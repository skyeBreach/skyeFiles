# ==================================================================================================================== #
# Polybar - Network Modules
#
# ==================================================================================================================== #
# Shared

[network]
interface = enp4s0

[module/network-base]
type = internal/network
interface = ${network.interface}
interface-type = wired
interval = 1.0
accumulate-stats = false
unknown-as-up = false

# ==================================================================================================================== #
# Link Speed

[module/wired-network-linkspeed]
inherit = module/network-base
format-connected = <label-connected>
format-connected-padding = 1
format-connected-prefix = %{T2}󰌷 %{T-}
format-connected-prefix-foreground = ${colors.mauve}
label-connected = "%{T1}%linkspeed%%{T-}"

# ==================================================================================================================== #
# Download Speed

[module/wired-network-downspeed]
inherit = module/network-base
format-connected = <label-connected>
format-connected-padding = 0
format-connected-prefix = %{T2} %{T-}
format-connected-prefix-foreground = ${colors.red}
label-connected = %{T1}%downspeed%%{T-}

# ==================================================================================================================== #
# Upload Speed

[module/wired-network-upspeed]
inherit = module/network-base
format-connected = <label-connected>
format-connected-padding = 0
format-connected-prefix = %{T2} %{T-}
format-connected-prefix-foreground = ${colors.green}
label-connected = "%{T1}%upspeed%%{T-}"

# ==================================================================================================================== #
