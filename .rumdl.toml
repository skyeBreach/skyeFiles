# ==================================================================================================================== #
# Rumdl - Root
#
# See:
# - https://rumdl.dev/global-settings/
# ==================================================================================================================== #
# Core Settings

[global]
flavor = "gfm"
exclude = [
    "node_modules/**",
    ".agents/skills/**",
    ".od-skills/**",
    "./AGENTS.md",
]


# Per-file flavor overrides (pattern -> flavor)
[per-file-flavor]
"README.md" = "gfm"
"**/*.mdx" = "mdx"

# ==================================================================================================================== #
# Ignores

[per-file-ignores]
"README.md" = ["MD033", "MD041"]
"AGENTS.md" = ["MD025", "MD041"]
"**/*.mdx" = ["MD025", "MD033", "MD041"]
"**/.ruler/*.md" = ["MD025", "MD041"]
".gitlab/{issue,merge_request}_templates/*.md" = ["MD041"]

# ==================================================================================================================== #
# Rules

[MD007]
indent = 4
style = "fixed"

[MD013]
line-length = 120
tables = true

# ==================================================================================================================== #
