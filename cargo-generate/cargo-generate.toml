# ==================================================================================================================== #
# Cargo Generate - User Global
#
#
# ==================================================================================================================== #
# 

[template]
cargo_generate_version = ">=0.25"
ignore = ["*.tera", ".github/workflows/*"] # copied without templating
exclude = ["target"]                       # not copied at all

# ==================================================================================================================== #
# Placeholders

[placeholders.license]
type = "string"
prompt = "License?"
choices = ["MIT", "Apache-2.0", "none"]
default = "Apache-2.0"

[placeholders.ci]
type = "bool"
prompt = "Add CI?"
default = true

[conditional.'ci == false']
ignore = [".github"]

# ==================================================================================================================== #
# Hooks

[hooks]
post = ["post.rhai"]

# ==================================================================================================================== #
