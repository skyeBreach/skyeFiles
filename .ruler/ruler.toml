# ==================================================================================================================== #
# Ruler - Config
#
# See:
# - https://ai.intellectronica.net/ruler for documentation.
# ==================================================================================================================== #
# Global Settings

default_agents = ["claude", "zed"]

[backup]
enabled = false

[gitignore]
enabled = true
local = true

# ==================================================================================================================== #
# MCP Servers

[mcp]
enabled = true
merge_strategy = "merge"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# ==================================================================================================================== #
# Skills

[skills]
enabled = true

# ==================================================================================================================== #
# Sub Agents

[agents.claude]
enabled = true
output_path = "AGENTS.md"

# ==================================================================================================================== #
