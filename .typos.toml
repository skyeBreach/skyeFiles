# ==================================================================================================================== #
# Typos - Workspace
#
# Configuration for typos-cli spell checking across the project.
#
# See:
#   - https://github.com/crate-ci/typos/blob/master/docs/reference.md
#==================================================================================================================== #
# Matches

[default]
extend-ignore-re = [
    # Ignore hex strings and hashes
    "\\b[0-9a-fA-F]{40,}\\b",
    # Ignore base64 strings
    "\\b[A-Za-z0-9+/]{40,}={0,2}\\b",
]

# Case Insensitive Words
[default.extend-words]
skyefiles = "skyefiles"

# ==================================================================================================================== #
# Files

[files]
ignore-hidden = false
extend-exclude = ["target/", ".git"]

# ==================================================================================================================== #
