# ==================================================================================================================== #
# Init System

[systemd.files]
"config/systemd/user" = "~/.config/systemd/user"

# ==================================================================================================================== #
# Window Manager

[i3.files]
"config/i3/config" = "~/.config/i3/config"
"config/i3/config.d" = "~/.config/i3/config.d"
"config/i3/betterlockscreenrc" = "~/.config/betterlockscreen/betterlockscreenrc"
"config/i3/wallpapers" = "~/.config/betterlockscreen/wallpapers"

[rofi.files]
"config/rofi" = "~/.config/rofi"

[dunst.files]
"config/dunst" = "~/.config/dunst"

[polybar.files]
"config/polybar" = "~/.config/polybar"

# ==================================================================================================================== #
# Desktop Utilities

[gtk-4.files]
"config/gtk-4" = "~/.config/gtk-4.0"

[xdg.files]
"config/xdg/user-dirs.dirs" = "~/.config/user-dirs.dirs"
"config/xdg/user-dirs.locale" = "~/.config/user-dirs.locale"
"config/xdg/mimeapps.list" = "~/.config/mimeapps.list"
"config/xdg/desktop/.gitkeep" = "~/desktop/.gitkeep"
"config/xdg/documents/.gitkeep" = "~/documents/.gitkeep"
"config/xdg/downloads/.gitkeep" = "~/downloads/.gitkeep"
"config/xdg/music/.gitkeep" = "~/music/.gitkeep"
"config/xdg/pictures/.gitkeep" = "~/pictures/.gitkeep"
"config/xdg/public/.gitkeep" = "~/public/.gitkeep"
"config/xdg/templates/.gitkeep" = "~/templates/.gitkeep"
"config/xdg/videos/.gitkeep" = "~/videos/.gitkeep"

[scripts.files]
"config/bin/set-monitors" = "~/bin/set-monitors"

# ==================================================================================================================== #
# Shell

[home.files]
"config/home/.zshenv" = "~/.zshenv"
"config/home/.profile" = "~/.profile"
"config/home/.editorconfig" = "~/.editorconfig"
"stylua.toml" = "~/.config/stylua/stylua.toml"

[zsh.files]
"config/zsh/.zshenv" = "~/.config/zsh/.zshenv"
"config/zsh/.zshrc" = "~/.config/zsh/.zshrc"
"config/zsh/.zsh_plugins.txt" = "~/.config/zsh/.zsh_plugins.txt"
"config/zsh/conf.d/" = "~/.config/zsh/conf.d/"
"config/zsh/functions/" = "~/.config/zsh/functions/"

# ==================================================================================================================== #
# Prompt

[starship.files]
"config/starship/starship.toml" = "~/.config/starship.toml"

[lsd.files]
"config/lsd/config.yml" = "~/.config/lsd/config.yml"
"config/lsd/colors.yml" = "~/.config/lsd/colors.yml"

# ==================================================================================================================== #
# Version Control

[git.files]
"config/git" = "~/.config/git"

[git.variables]
git_user_name = "Skye Benson"
git_user_email = "skyebenson@breachedsoftware.dev"

# ==================================================================================================================== #
# Project Templates

[athame.files]
"config/athame" = "~/.config/athame"

# ==================================================================================================================== #
# Package Management

[mise.files]
"config/mise/config" = "~/.config/mise"

# ==================================================================================================================== #
# Terminal Emulator

[wezterm.files]
"config/wezterm" = "~/.config/wezterm"

# ==================================================================================================================== #
# Editor

[nvim.files]
"config/nvim" = { target = "~/.config/nvim", type = "symbolic" }

[ue5.files]
"config/ue5/applications" = { target = "~/.local/share/applications", type = "symbolic" }

# ==================================================================================================================== #
# Applications

[apiark.files]
"config/apiark/config" = "~/.config/apiark"

[betterdiscord.files]
"config/betterdiscord/themes" = "~/.config/BetterDiscord/themes"
"config/betterdiscord/data" = "~/.config/BetterDiscord/data"

[bruno.files]
"config/bruno/preferences.json" = "~/.config/bruno/preferences.json"

[opencode.files]
"config/opencode/opencode.jsonc" = "~/.config/opencode/opencode.jsonc"
"config/opencode/tui.jsonc" = "~/.config/opencode/tui.jsonc"
"config/opencode/skills" = "~/.config/opencode/skills"

[wakatime.files]
"config/wakatime" = "~/.config/wakatime"

[just.files]
"config/just" = { target = "~/.config/just", type = "symbolic" }

[glances.files]
"config/glances" = { target = "~/.config/glances", type = "symbolic" }

[shiopa.files]
"config/shiopa/config" = { target = "~/.config/shiopa", type = "symbolic" }
"config/shiopa/applications/shiopa.desktop" = { target = "~/.local/share/applications/shiopa.desktop", type = "symbolic" }
"config/shiopa/bin/shiopa" = { target = "~/.local/bin/shiopa", type = "symbolic" }

[spotify.files]
"config/spotify/spotify-flags.conf" = "~/.config/spotify-flags.conf"

