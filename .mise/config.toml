# ==================================================================================================================== #
# Mise - Root
#
# See:
#   - https://mise.jdx.dev/configuration.html
# ==================================================================================================================== #
# Settings

[settings]
# Locking/Pinning
lockfile = true
locked = false

# Colours
color_theme = "catppuccin"

[settings.status]
missing_tools = "always"

# ==================================================================================================================== #
# Environment

[env]
_.file = { path = ".env.local", redact = true }

# ==================================================================================================================== #
# Variables

[vars]
workspace_root = "{{config_root}}"

# ==================================================================================================================== #
# Tasks

[task_config]
includes = ["tools/mise/tasks"]
dir = "{{config_root}}"

# ==================================================================================================================== #
