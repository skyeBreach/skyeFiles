[module/time]
type = internal/date
interval = 1


date = %H:%M:%S
label = %date%
label-foreground = ${colors.text}
label-padding-left = 1
label-padding-right = 1

[module/datetime]
type = internal/date
interval = 1
format-suffix = %{T2}󰸗 %{T-}
format-suffix-foreground = ${colors.mauve}

date = %a %d %b %H:%M:%S
label = %date%
label-foreground = ${colors.text}
label-padding-left = 1
label-padding-right = 1
