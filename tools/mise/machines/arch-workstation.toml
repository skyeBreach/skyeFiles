# Dotfile Groups

[bootstrap]
dotfile_groups = [
    "home",
    "zsh",
    "starship",
    "git",
    "nvim",
    "lsd",
    "i3",
    "i3-lockscreen",
    "wezterm",
    "rofi",
    "dunst",
    "scripts",
    "gtk-4",
    "xdg",
    "bruno",
    "opencode",
]

